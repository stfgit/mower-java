---
service:
  orgIdentifier: "stf"
  projectIdentifier: "Mower"
  serviceDefinition:
    spec:
      manifests:
      - manifest:
          identifier: "jobmanifest"
          type: "K8sManifest"
          spec:
            store:
              type: "Github"
              spec:
                connectorRef: "org.gitstf"
                gitFetchType: "Branch"
                paths:
                - ".harness/manifests"
                repoName: "mower-java"
                branch: "main"
            valuesPaths:
            - ".harness/manifests/values.yaml"
            skipResourceVersioning: false
            enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: "<+input>"
          sources:
          - spec:
              connectorRef: "org.Dockerhub"
              imagePath: "stfgit/mower-java"
              tag: "<+input>"
              digest: ""
            identifier: "java_mower_image"
            type: "DockerRegistry"
    type: "Kubernetes"
  identifier: "mower"
  tags: {}
  name: "mower"
