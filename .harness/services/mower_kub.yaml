service:
  name: mower_kub
  identifier: mower_kub
  orgIdentifier: stf
  projectIdentifier: Mower
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: java_manifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: account.Github
                  gitFetchType: Branch
                  paths:
                    - .harness/manifests/deployment.yaml
                    - .harness/manifests/service.yaml
                    - .harness/manifests/configmap.yaml
                  repoName: stfgit/mower-java
                  branch: main
              valuesPaths:
                - .harness/manifests/values.yaml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
    type: Kubernetes
