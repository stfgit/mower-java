inputSet:
  pipeline:
    identifier: mvn_ci_cd_copy_tplt
    properties:
      ci:
        codebase:
          connectorRef: account.Github
          repoName: stfgit/mower-java
          build:
            spec:
              branch: main
            type: branch
    stages:
      - stage:
          identifier: source_code_scan
          template:
            templateInputs:
              type: SecurityTests
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - parallel:
                        - step:
                            identifier: owasp
                            type: Owasp
                            spec:
                              advanced:
                                fail_on_severity: ""
                              resources:
                                limits:
                                  memory: 2Gi
                                  cpu: 500m
                        - step:
                            identifier: aquatrivy
                            type: AquaTrivy
                            spec:
                              advanced:
                                fail_on_severity: ""
                              resources:
                                limits:
                                  memory: ""
                                  cpu: ""
                        - step:
                            identifier: gitleaks
                            type: Gitleaks
                            spec:
                              advanced:
                                fail_on_severity: ""
                              resources:
                                limits:
                                  memory: ""
                                  cpu: ""
              delegateSelectors: []
      - stage:
          identifier: mvn_build_and_push
          template:
            templateInputs:
              type: CI
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: mvn_build
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: mvn_test_with_coverage
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: coverage_quality_gate
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: alpine:latest
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: build_and_push_docker_image
                        type: BuildAndPushDockerRegistry
                        spec:
                          connectorRef: org.Dockerhub
                          repo: stfgit/mower-java
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
              delegateSelectors: []
      - stage:
          identifier: scan_images
          template:
            templateInputs:
              type: SecurityTests
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: aquatrivy_container
                        type: AquaTrivy
                        spec:
                          advanced:
                            fail_on_severity: ""
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
              delegateSelectors: []
      - stage:
          identifier: mep_approval
          template:
            templateInputs:
              type: Approval
              spec:
                execution:
                  steps:
                    - step:
                        identifier: approval
                        type: HarnessApproval
                        spec:
                          approvers:
                            minimumCount: 1
                            userGroups:
                              - org.DevOps_Team
              delegateSelectors: []
  name: latest
  identifier: latest
  orgIdentifier: stf
  projectIdentifier: Mower
