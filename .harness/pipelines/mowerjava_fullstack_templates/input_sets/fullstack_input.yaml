inputSet:
  name: fullstack input
  identifier: fullstack_input
  orgIdentifier: stf
  projectIdentifier: Mower
  pipeline:
    identifier: mowerjava_fullstack_templates
    properties:
      ci:
        codebase:
          connectorRef: org.gitstf
          repoName: mower-java
          build: <+input>
    stages:
      - stage:
          identifier: source_code_scan
          template:
            templateInputs:
              spec:
                infrastructure:
                  spec:
                    connectorRef: org.kubdesktop
                    namespace: harness-ci
                execution:
                  steps:
                    - parallel:
                        - step:
                            identifier: owasp
                            spec:
                              advanced:
                                fail_on_severity: high
                              resources:
                                limits:
                                  memory: 2Gi
                                  cpu: 500m
                        - step:
                            identifier: aquatrivy
                            spec:
                              advanced:
                                fail_on_severity: high
                              resources:
                                limits:
                                  memory: 2Gi
                                  cpu: 500m
                        - step:
                            identifier: gitleaks
                            spec:
                              advanced:
                                fail_on_severity: high
                              resources:
                                limits:
                                  memory: 1Gi
                                  cpu: 500m
              delegateSelectors:
                - helm-delegate
      - stage:
          identifier: mvn_build_and_push
          template:
            templateInputs:
              spec:
                infrastructure:
                  spec:
                    connectorRef: org.kubdesktop
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: mvn_build
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: 4Gi
                              cpu: 2000m
                    - step:
                        identifier: mvn_test_with_coverage
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: 4Gi
                              cpu: 2000m
                    - step:
                        identifier: coverage_quality_gate
                        spec:
                          connectorRef: org.Dockerhub
                          image: alpine:latest
                          resources:
                            limits:
                              memory: 512Mi
                              cpu: 500m
                    - step:
                        identifier: build_and_push_docker_image
                        spec:
                          connectorRef: org.Dockerhub
                          repo: stfgit/mower-java-backend
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
              delegateSelectors:
                - helm-delegate
      - stage:
          identifier: frontend_build_and_push
          template:
            templateInputs:
              spec:
                infrastructure:
                  spec:
                    connectorRef: org.kubdesktop
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: run_build
                        spec:
                          connectorRef: org.Dockerhub
                          image: node:18-alpine
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
                    - step:
                        identifier: frontend_docker_build_push
                        spec:
                          connectorRef: org.Dockerhub
                          repo: stfgit/mower-java-frontend
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
              delegateSelectors:
                - helm-delegate
      - stage:
          identifier: scan_images
          template:
            templateInputs:
              spec:
                infrastructure:
                  spec:
                    connectorRef: org.kubdesktop
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: aquatrivy_container
                        spec:
                          advanced:
                            fail_on_severity: critical
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
              delegateSelectors:
                - helm-delegate
      - stage:
          identifier: deploy_dev
          template:
            templateInputs:
              spec:
                service:
                  serviceInputs:
                    serviceDefinition:
                      spec:
                        artifacts:
                          primary:
                            primaryArtifactRef: backend_image
                            sources:
                              - identifier: backend_image
                                type: DockerRegistry
                                spec:
                                  tag: <+pipeline.executionId>
                              - identifier: frontend_image
                                type: DockerRegistry
                                spec:
                                  tag: <+pipeline.executionId>
      - stage:
          identifier: mep_approval
          template:
            templateInputs:
              spec:
                execution:
                  steps:
                    - step:
                        identifier: approval
                        spec:
                          approvers:
                            minimumCount: 1
                            userGroups:
                              - org.DevSecOps_Team
              delegateSelectors:
                - helm-delegate