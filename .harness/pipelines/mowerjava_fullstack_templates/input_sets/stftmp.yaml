inputSet:
  pipeline:
    identifier: mowerjava_fullstack_templates
    properties:
      ci:
        codebase:
          connectorRef: account.Github
          repoName: stfgit/mower-java
          build:
            spec:
              branch: main
            type: branch
    stages:
      - stage:
          identifier: source_code_scan
          template:
            templateInputs:
              type: SecurityTests
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - parallel:
                        - step:
                            identifier: owasp
                            type: Owasp
                            spec:
                              advanced:
                                fail_on_severity: none
                              resources:
                                limits:
                                  memory: 2Gi
                                  cpu: 500m
                        - step:
                            identifier: aquatrivy
                            type: AquaTrivy
                            spec:
                              advanced:
                                fail_on_severity: none
                              resources:
                                limits:
                                  memory: ""
                                  cpu: ""
                        - step:
                            identifier: gitleaks
                            type: Gitleaks
                            spec:
                              advanced:
                                fail_on_severity: low
                              resources:
                                limits:
                                  memory: ""
                                  cpu: ""
              delegateSelectors: []
      - stage:
          identifier: mvn_build_and_push
          template:
            templateInputs:
              type: CI
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: mvn_build
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: mvn_test_with_coverage
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: maven:3.9.6-eclipse-temurin-21
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: coverage_quality_gate
                        type: Run
                        spec:
                          connectorRef: org.Dockerhub
                          image: alpine:latest
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
                    - step:
                        identifier: build_and_push_docker_image
                        type: BuildAndPushDockerRegistry
                        spec:
                          connectorRef: org.Dockerhub
                          repo: stfgit/mower-java-backend
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
              delegateSelectors: []
      - stage:
          identifier: npm_build_and_push
          template:
            templateInputs:
              type: CI
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: Workspace_Validation
                        spec:
                          workingDirectory: "mower-frontend"
                    - step:
                        identifier: Install_Dependencies
                        spec:
                          workingDirectory: "mower-frontend"
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
                    - step:
                        identifier: Code_Quality_Check
                        spec:
                          workingDirectory: "mower-frontend"
                          resources:
                            limits:
                              memory: 1Gi
                              cpu: 500m
                    - step:
                        identifier: Build_Application
                        spec:
                          workingDirectory: "mower-frontend"
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
                    - step:
                        identifier: Run_Tests
                        spec:
                          workingDirectory: "mower-frontend"
                          resources:
                            limits:
                              memory: 1Gi
                              cpu: 500m
                    - step:
                        identifier: Security_Audit
                        spec:
                          workingDirectory: "mower-frontend"
                          resources:
                            limits:
                              memory: 1Gi
                              cpu: 500m
                    - step:
                        identifier: BuildAndPushDockerRegistry_1
                        spec:
                          connectorRef: org.Dockerhub
                          repo: stfgit/mower-java-frontend
                          context: mower-frontend
                          dockerfile: mower-frontend/Dockerfile
                          tags:
                            - <+pipeline.executionId>
                            - latest
                          resources:
                            limits:
                              memory: 2Gi
                              cpu: 1000m
      - stage:
          identifier: scan_images
          template:
            templateInputs:
              type: SecurityTests
              spec:
                infrastructure:
                  type: KubernetesDirect
                  spec:
                    connectorRef: account.k8sdocacloud
                    namespace: harness-ci
                execution:
                  steps:
                    - step:
                        identifier: aquatrivy_container
                        type: AquaTrivy
                        spec:
                          advanced:
                            fail_on_severity: none
                          resources:
                            limits:
                              memory: ""
                              cpu: ""
              delegateSelectors: []
      - stage:
          identifier: deploy_dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceInputs:
                    serviceDefinition:
                      type: Kubernetes
                      spec:
                        artifacts:
                          primary:
                            primaryArtifactRef: backend_image
                            sources:
                              - identifier: backend_image
                                type: DockerRegistry
                                spec:
                                  tag: latest
      - stage:
          identifier: mep_approval
          template:
            templateInputs:
              type: Approval
              spec:
                execution:
                  steps:
                    - step:
                        identifier: approval
                        type: HarnessApproval
                        spec:
                          approvers:
                            minimumCount: 1
                            userGroups:
                              - org.DevOps_Team
              delegateSelectors: []
  name: stf v2
  identifier: stf_v2
  orgIdentifier: stf
  projectIdentifier: Mower