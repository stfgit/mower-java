pipeline:
  orgIdentifier: stf
  projectIdentifier: Mower
  properties:
    ci:
      codebase:
        connectorRef: org.gitstf
        repoName: mower-java
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and test
        identifier: Build_and_test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kubdesktop
              namespace: mower
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Build
                  identifier: Maven_Build
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🔨 Starting Maven build..."
                      mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
                      echo "✅ Maven build completed successfully"

                      # Afficher les artefacts créés
                      echo "📦 Generated artifacts:"
                      ls -la target/*.jar 2>/dev/null || echo "No JAR files found"
              - step:
                  type: Run
                  name: Maven Test with Coverage
                  identifier: Maven_Test_Coverage
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🧪 Running tests with JaCoCo coverage..."

                      # Exécuter tests avec coverage
                      mvn test jacoco:report -B

                      # Extraire les métriques de coverage
                      if [ -f "target/site/jacoco/jacoco.csv" ]; then
                        # Extraire les métriques principales du CSV
                        LINE_COVERAGE=$(awk -F',' 'END {print $8}' target/site/jacoco/jacoco.csv)
                        BRANCH_COVERAGE=$(awk -F',' 'END {print $10}' target/site/jacoco/jacoco.csv)
                        INSTRUCTION_COVERAGE=$(awk -F',' 'END {print $4}' target/site/jacoco/jacoco.csv)
                        
                        echo "📊 Coverage Summary:"
                        echo "   Lines: ${LINE_COVERAGE}%"
                        echo "   Branches: ${BRANCH_COVERAGE}%"
                        echo "   Instructions: ${INSTRUCTION_COVERAGE}%"
                        
                        # Afficher un résumé détaillé des fichiers
                        echo "📋 Detailed Coverage Report:"
                        echo "=========================="
                        find target/site/jacoco -name "*.html" -not -name "index.html" -exec basename {} .html \; | head -10
                        
                        # Créer un résumé en markdown
                        cat > coverage-summary.md << EOF
                        # Code Coverage Report

                        ## 📊 Overall Metrics
                        - **Line Coverage**: ${LINE_COVERAGE}%
                        - **Branch Coverage**: ${BRANCH_COVERAGE}%  
                        - **Instruction Coverage**: ${INSTRUCTION_COVERAGE}%

                        ## 📁 Report Files Generated
                        - HTML Report: \`target/site/jacoco/index.html\`
                        - XML Report: \`target/site/jacoco/jacoco.xml\`
                        - CSV Report: \`target/site/jacoco/jacoco.csv\`

                        ## 🎯 Coverage Status
                        $(if [ "${LINE_COVERAGE}" -gt 80 ]; then echo "✅ Coverage threshold met"; else echo "❌ Coverage below 80%"; fi)
                        EOF
                                  
                                  echo "📄 Coverage summary written to coverage-summary.md"
                                  cat coverage-summary.md
                                  
                                else
                                  echo "❌ JaCoCo report not found"
                                  exit 1
                                fi
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - target/surefire-reports/*.xml
                            outputVariables:
                              - name: LINE_COVERAGE
                                type: String
                                value: <+execution.steps.Maven_Test_Coverage.output.outputVariables.LINE_COVERAGE>
                              - name: BRANCH_COVERAGE
                                type: String
                                value: <+execution.steps.Maven_Test_Coverage.output.outputVariables.BRANCH_COVERAGE>
                              - name: INSTRUCTION_COVERAGE
                                type: String
                                value: <+execution.steps.Maven_Test_Coverage.output.outputVariables.INSTRUCTION_COVERAGE>
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: Build_and_Push_Docker_Image
                  spec:
                    connectorRef: Dockerhub
                    repo: stfgit/mower-java
                    tags:
                      - <+pipeline.executionId>
                      - latest
                    dockerfile: Dockerfile
                    context: .
                    buildArgs: {}
                  when:
                    stageStatus: Success
          caching:
            enabled: true
            paths:
              - /root/.m2
          buildIntelligence:
            enabled: true
    - stage:
        name: Deploy and execute job
        identifier: Deploy_and_execute_job
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: mower_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: org.dev
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: mower_infra
          execution:
            steps:
              - step:
                  type: K8sDelete
                  name: Cleanup Old Jobs
                  identifier: Cleanup_Old_Jobs
                  spec:
                    deleteResources:
                      type: ManifestPath
                      spec:
                        manifestPaths:
                          - cleanup-job.yaml
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: K8sApply
                  name: Deploy Job
                  identifier: Deploy_Job
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: false
                    skipRendering: false
                    overrides: []
                    filePaths:
                      - job.yaml
                      - configmap.yaml
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Wait for Job Completion
                  identifier: Wait_for_Job_Completion
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          JOB_NAME="mower-java-<+pipeline.startTs>"
                          NAMESPACE="<+infra.namespace>"
                          TIMEOUT=600  # 10 minutes
                                      
                          echo "Waiting for job $JOB_NAME to complete in namespace $NAMESPACE..."
                                        
                            # Attendre la completion
                            kubectl wait --for=condition=complete job/$JOB_NAME -n $NAMESPACE --timeout=${TIMEOUT}s
                            WAIT_RESULT=$?
                                        
                            # Récupérer les informations du job
                            SUCCESS_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "0")
                            FAILED_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
                                        
                            echo "📊 Job Results:"
                            echo "   kubectl wait result: $WAIT_RESULT"
                            echo "   Successful pods: $SUCCESS_COUNT"
                            echo "   Failed pods: $FAILED_COUNT"
                                        
                            if [ "$WAIT_RESULT" -eq 0 ] && [ "$SUCCESS_COUNT" -gt 0 ]; then
                              echo "✅ Job completed successfully!"
                              
                              # Afficher les logs
                              echo "📋 Application output:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              exit 0
                            else
                              echo "❌ Job did not complete successfully"
                              
                              # Logs de debug
                              echo "🔍 All pods for this job:"
                              kubectl get pods -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              echo "🔍 Job logs:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE --tail=50
                              
                              echo "🔍 Job description:"
                              kubectl describe job $JOB_NAME -n $NAMESPACE
                              
                              exit 1
                            fi
                    environmentVariables: []
                    outputVariables: []
                    includeInfraSelectors: false
                  timeout: 15m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        delegateSelectors:
          - helm-delegate
  identifier: mowerjava_cicd
  tags: {}
  name: mower-java - ci-cd
