pipeline:
  orgIdentifier: stf
  projectIdentifier: Mower
  properties:
    ci:
      codebase:
        connectorRef: org.gitstf
        repoName: mower-java
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and test
        identifier: Build_and_test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kubdesktop
              namespace: mower
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Build
                  identifier: Maven_Build
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🔨 Starting Maven build..."
                      mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
                      echo "✅ Maven build completed successfully"

                      # Afficher les artefacts créés
                      echo "📦 Generated artifacts:"
                      ls -la target/*.jar 2>/dev/null || echo "No JAR files found"
              - step:
                  type: Run
                  name: Maven Test
                  identifier: Maven_Test
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🧪 Starting Maven tests..."
                      mvn test -B
                      echo "✅ Tests completed successfully"

                      # Afficher un résumé des tests
                      echo "📊 Test summary:"
                      find target/surefire-reports -name "*.xml" -exec echo "Found test report: {}" \; 2>/dev/null || echo "No test reports found"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - target/surefire-reports/*.xml
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
              - step:
                  type: Run
                  name: Code Quality Analysis
                  identifier: Code_Quality_Analysis
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🔍 Running code quality analysis..."

                      # Générer le rapport JaCoCo
                      echo "📊 Generating JaCoCo coverage report..."
                      mvn jacoco:report

                      # Vérifier que le rapport a été généré
                      if [ -d "target/site/jacoco" ]; then
                        echo "✅ JaCoCo report generated successfully"
                        
                        # Afficher un résumé dans les logs
                        echo "📈 Coverage Summary:"
                        if [ -f "target/site/jacoco/jacoco.csv" ]; then
                          echo "Coverage data found - preparing for upload"
                          
                          # Calculer et afficher le pourcentage de couverture
                          LINE_MISSED=$(awk -F',' 'NR==2 {print $8}' target/site/jacoco/jacoco.csv || echo "0")
                          LINE_COVERED=$(awk -F',' 'NR==2 {print $9}' target/site/jacoco/jacoco.csv || echo "0")
                          LINE_TOTAL=$((LINE_MISSED + LINE_COVERED))
                          
                          if [ "$LINE_TOTAL" -gt 0 ]; then
                            LINE_PERCENT=$(echo "scale=1; $LINE_COVERED * 100 / $LINE_TOTAL" | bc -l 2>/dev/null || echo "0")
                            echo "📊 Line Coverage: ${LINE_PERCENT}% ($LINE_COVERED/$LINE_TOTAL lines)"
                          fi
                        fi
                        
                        # Créer un dossier pour les artefacts Harness
                        mkdir -p /harness/jacoco-reports
                        
                        # Copier tous les rapports JaCoCo
                        cp -r target/site/jacoco/* /harness/jacoco-reports/
                        
                        # Créer un fichier de résumé pour Harness
                        echo "JaCoCo Code Coverage Report" > /harness/jacoco-reports/README.txt
                        echo "============================" >> /harness/jacoco-reports/README.txt
                        echo "Generated on: $(date)" >> /harness/jacoco-reports/README.txt
                        echo "" >> /harness/jacoco-reports/README.txt
                        echo "Files included:" >> /harness/jacoco-reports/README.txt
                        echo "- index.html : Main coverage report (open this in browser)" >> /harness/jacoco-reports/README.txt
                        echo "- jacoco.xml : XML format for CI tools" >> /harness/jacoco-reports/README.txt
                        echo "- jacoco.csv : CSV format for analysis" >> /harness/jacoco-reports/README.txt
                        echo "" >> /harness/jacoco-reports/README.txt
                        
                        if [ -f "target/site/jacoco/jacoco.csv" ]; then
                          echo "Coverage Summary:" >> /harness/jacoco-reports/README.txt
                          head -n 2 target/site/jacoco/jacoco.csv >> /harness/jacoco-reports/README.txt
                        fi
                        
                        echo "📁 JaCoCo reports prepared for Harness artifacts"
                        ls -la /harness/jacoco-reports/
                        
                      else
                        echo "⚠️ JaCoCo report directory not found"
                        echo "Checking Maven output..."
                        mvn jacoco:help -Ddetail=true
                      fi

                      # Vérifier la compilation
                      mvn compile -q

                      echo "✅ Code quality analysis completed"
                    outputVariables:
                      - name: JACOCO_COVERAGE_PERCENT
                        type: String
                        value: <+step.Code_Quality_Analysis.output.outputVariables.LINE_PERCENT>
                    artifacts:
                      - identifier: jacoco_reports
                        type: GenericArtifact
                        spec:
                          source: /harness/jacoco-reports
                          metadata:
                            type: JaCoCo Coverage Reports
                            description: Code coverage reports generated by JaCoCo
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: Build_and_Push_Docker_Image
                  spec:
                    connectorRef: Dockerhub
                    repo: stfgit/mower-java
                    tags:
                      - <+pipeline.executionId>
                      - latest
                    dockerfile: Dockerfile
                    context: .
                    buildArgs: {}
                  when:
                    stageStatus: Success
          caching:
            enabled: true
            paths:
              - /root/.m2
          buildIntelligence:
            enabled: true
    - stage:
        name: Deploy and execute job
        identifier: Deploy_and_execute_job
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: mower_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: org.dev
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: mower_infra
          execution:
            steps:
              - step:
                  type: K8sDelete
                  name: Cleanup Old Jobs
                  identifier: Cleanup_Old_Jobs
                  spec:
                    deleteResources:
                      type: ManifestPath
                      spec:
                        manifestPaths:
                          - cleanup-job.yaml
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: K8sApply
                  name: Deploy Job
                  identifier: Deploy_Job
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: false
                    skipRendering: false
                    overrides: []
                    filePaths:
                      - job.yaml
                      - configmap.yaml
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Wait for Job Completion
                  identifier: Wait_for_Job_Completion
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          JOB_NAME="mower-java-<+pipeline.startTs>"
                          NAMESPACE="<+infra.namespace>"
                          TIMEOUT=600  # 10 minutes
                                      
                          echo "Waiting for job $JOB_NAME to complete in namespace $NAMESPACE..."
                                        
                            # Attendre la completion
                            kubectl wait --for=condition=complete job/$JOB_NAME -n $NAMESPACE --timeout=${TIMEOUT}s
                            WAIT_RESULT=$?
                                        
                            # Récupérer les informations du job
                            SUCCESS_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "0")
                            FAILED_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
                                        
                            echo "📊 Job Results:"
                            echo "   kubectl wait result: $WAIT_RESULT"
                            echo "   Successful pods: $SUCCESS_COUNT"
                            echo "   Failed pods: $FAILED_COUNT"
                                        
                            if [ "$WAIT_RESULT" -eq 0 ] && [ "$SUCCESS_COUNT" -gt 0 ]; then
                              echo "✅ Job completed successfully!"
                              
                              # Afficher les logs
                              echo "📋 Application output:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              exit 0
                            else
                              echo "❌ Job did not complete successfully"
                              
                              # Logs de debug
                              echo "🔍 All pods for this job:"
                              kubectl get pods -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              echo "🔍 Job logs:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE --tail=50
                              
                              echo "🔍 Job description:"
                              kubectl describe job $JOB_NAME -n $NAMESPACE
                              
                              exit 1
                            fi
                    environmentVariables: []
                    outputVariables: []
                    includeInfraSelectors: false
                  timeout: 15m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        delegateSelectors:
          - helm-delegate
  identifier: mowerjava_cicd
  tags: {}
  name: mower-java - ci-cd
