pipeline:
  orgIdentifier: stf
  projectIdentifier: Mower
  properties:
    ci:
      codebase:
        connectorRef: org.gitstf
        repoName: mower-java
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and test
        identifier: Build_and_test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kubdesktop
              namespace: mower
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Build
                  identifier: Maven_Build
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🔨 Starting Maven build..."
                      mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
                      echo "✅ Maven build completed successfully"

                      # Afficher les artefacts créés
                      echo "📦 Generated artifacts:"
                      ls -la target/*.jar 2>/dev/null || echo "No JAR files found"
              - step:
                  type: Run
                  name: Maven Test with Coverage
                  identifier: Maven_Test_Coverage
                  spec:
                    connectorRef: Dockerhub
                    image: maven:3.9.6-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      echo "🧪 Running tests with JaCoCo coverage..."

                      # Exécuter tests avec coverage
                      mvn test jacoco:report -B

                      # Vérifier la génération des rapports
                      if [ -f "target/site/jacoco/jacoco.csv" ]; then
                        echo "✅ JaCoCo reports generated successfully"
                        
                        # Extraire les métriques du CSV (dernière ligne = totaux)
                        LAST_LINE=$(tail -n 1 target/site/jacoco/jacoco.csv)
                        
                        # Parser les colonnes CSV (format JaCoCo standard)
                        # GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,INSTRUCTION_RATIO,BRANCH_MISSED,BRANCH_COVERED,BRANCH_RATIO,LINE_MISSED,LINE_COVERED,LINE_RATIO,COMPLEXITY_MISSED,COMPLEXITY_COVERED,COMPLEXITY_RATIO,METHOD_MISSED,METHOD_COVERED,METHOD_RATIO
                        
                        INSTRUCTION_MISSED=$(echo "$LAST_LINE" | cut -d',' -f4)
                        INSTRUCTION_COVERED=$(echo "$LAST_LINE" | cut -d',' -f5)
                        LINE_MISSED=$(echo "$LAST_LINE" | cut -d',' -f10)
                        LINE_COVERED=$(echo "$LAST_LINE" | cut -d',' -f11)
                        
                        # Calculer les pourcentages
                        if [ "$INSTRUCTION_COVERED" -gt 0 ] || [ "$INSTRUCTION_MISSED" -gt 0 ]; then
                          TOTAL_INSTRUCTIONS=$((INSTRUCTION_MISSED + INSTRUCTION_COVERED))
                          INSTRUCTION_COVERAGE=$(echo "scale=2; $INSTRUCTION_COVERED * 100 / $TOTAL_INSTRUCTIONS" | bc -l)
                        else
                          INSTRUCTION_COVERAGE="0.00"
                        fi
                        
                        if [ "$LINE_COVERED" -gt 0 ] || [ "$LINE_MISSED" -gt 0 ]; then
                          TOTAL_LINES=$((LINE_MISSED + LINE_COVERED))
                          LINE_COVERAGE=$(echo "scale=2; $LINE_COVERED * 100 / $TOTAL_LINES" | bc -l)
                        else
                          LINE_COVERAGE="0.00"
                        fi
                        
                        # Afficher le résumé
                        echo ""
                        echo "📊 COVERAGE ANALYSIS RESULTS"
                        echo "============================"
                        echo "📈 Line Coverage:        ${LINE_COVERAGE}% (${LINE_COVERED}/${TOTAL_LINES})"
                        echo "⚡ Instruction Coverage: ${INSTRUCTION_COVERAGE}% (${INSTRUCTION_COVERED}/${TOTAL_INSTRUCTIONS})"
                        echo ""
                        
                        # Évaluation qualitative
                        LINE_THRESHOLD=80
                        if [ "$(echo "$LINE_COVERAGE >= $LINE_THRESHOLD" | bc -l)" -eq 1 ]; then
                          echo "✅ Coverage quality: EXCELLENT (≥${LINE_THRESHOLD}%)"
                          COVERAGE_STATUS="PASS"
                        elif [ "$(echo "$LINE_COVERAGE >= 60" | bc -l)" -eq 1 ]; then
                          echo "⚠️  Coverage quality: GOOD (≥60%)"
                          COVERAGE_STATUS="WARN"
                        else
                          echo "❌ Coverage quality: NEEDS IMPROVEMENT (<60%)"
                          COVERAGE_STATUS="FAIL"
                        fi
                        
                        echo ""
                        echo "📁 Generated artifacts:"
                        echo "   📄 HTML Report: target/site/jacoco/index.html"
                        echo "   📊 XML Report:  target/site/jacoco/jacoco.xml"
                        echo "   📈 CSV Data:    target/site/jacoco/jacoco.csv"
                        echo ""
                        
                        # Exporter les variables pour les étapes suivantes
                        echo "LINE_COVERAGE=${LINE_COVERAGE}" >> $HARNESS_OUTPUT_VARIABLES
                        echo "INSTRUCTION_COVERAGE=${INSTRUCTION_COVERAGE}" >> $HARNESS_OUTPUT_VARIABLES
                        echo "COVERAGE_STATUS=${COVERAGE_STATUS}" >> $HARNESS_OUTPUT_VARIABLES
                        echo "TOTAL_LINES=${TOTAL_LINES}" >> $HARNESS_OUTPUT_VARIABLES
                        echo "COVERED_LINES=${LINE_COVERED}" >> $HARNESS_OUTPUT_VARIABLES

                        echo "✅ Coverage analysis completed successfully"
                      else
                        echo "❌ JaCoCo CSV report not found at target/site/jacoco/jacoco.csv"
                        echo "🔍 Available files:"
                        find target -name "*.xml" -o -name "*.csv" -o -name "*.html" | head -10
                        exit 1
                      fi

                      # Compiler pour s'assurer que tout est OK
                      mvn compile -q
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - target/surefire-reports/*.xml
                  outputVariables:
                    - name: LINE_COVERAGE
                      type: String
                      value: <+step.output.outputVariables.LINE_COVERAGE>
                    - name: BRANCH_COVERAGE
                      type: String
                      value: <+step.output.outputVariables.BRANCH_COVERAGE>
                    - name: INSTRUCTION_COVERAGE
                      type: String
                      value: <+step.output.outputVariables.INSTRUCTION_COVERAGE>
                    - name: COVERAGE_STATUS
                      type: String
                      value: <+step.output.outputVariables.COVERAGE_STATUS>
                    - name: TOTAL_LINES
                      type: String
                      value: <+step.output.outputVariables.TOTAL_LINES>
                    - name: COVERED_LINES
                      type: String
                      value: <+step.output.outputVariables.COVERED_LINES>
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: Build_and_Push_Docker_Image
                  spec:
                    connectorRef: Dockerhub
                    repo: stfgit/mower-java
                    tags:
                      - <+pipeline.executionId>
                      - latest
                    dockerfile: Dockerfile
                    context: .
                    buildArgs: {}
                  when:
                    stageStatus: Success
          caching:
            enabled: true
            paths:
              - /root/.m2
          buildIntelligence:
            enabled: true
    - stage:
        name: Deploy and execute job
        identifier: Deploy_and_execute_job
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: mower_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: org.dev
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: mower_infra
          execution:
            steps:
              - step:
                  type: K8sDelete
                  name: Cleanup Old Jobs
                  identifier: Cleanup_Old_Jobs
                  spec:
                    deleteResources:
                      type: ManifestPath
                      spec:
                        manifestPaths:
                          - cleanup-job.yaml
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: K8sApply
                  name: Deploy Job
                  identifier: Deploy_Job
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: false
                    skipRendering: false
                    overrides: []
                    filePaths:
                      - job.yaml
                      - configmap.yaml
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Wait for Job Completion
                  identifier: Wait_for_Job_Completion
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          JOB_NAME="mower-java-<+pipeline.startTs>"
                          NAMESPACE="<+infra.namespace>"
                          TIMEOUT=600  # 10 minutes
                                      
                          echo "Waiting for job $JOB_NAME to complete in namespace $NAMESPACE..."
                                        
                            # Attendre la completion
                            kubectl wait --for=condition=complete job/$JOB_NAME -n $NAMESPACE --timeout=${TIMEOUT}s
                            WAIT_RESULT=$?
                                        
                            # Récupérer les informations du job
                            SUCCESS_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "0")
                            FAILED_COUNT=$(kubectl get job $JOB_NAME -n $NAMESPACE -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
                                        
                            echo "📊 Job Results:"
                            echo "   kubectl wait result: $WAIT_RESULT"
                            echo "   Successful pods: $SUCCESS_COUNT"
                            echo "   Failed pods: $FAILED_COUNT"
                                        
                            if [ "$WAIT_RESULT" -eq 0 ] && [ "$SUCCESS_COUNT" -gt 0 ]; then
                              echo "✅ Job completed successfully!"
                              
                              # Afficher les logs
                              echo "📋 Application output:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              exit 0
                            else
                              echo "❌ Job did not complete successfully"
                              
                              # Logs de debug
                              echo "🔍 All pods for this job:"
                              kubectl get pods -l job-name=$JOB_NAME -n $NAMESPACE
                              
                              echo "🔍 Job logs:"
                              kubectl logs -l job-name=$JOB_NAME -n $NAMESPACE --tail=50
                              
                              echo "🔍 Job description:"
                              kubectl describe job $JOB_NAME -n $NAMESPACE
                              
                              exit 1
                            fi
                    environmentVariables: []
                    outputVariables: []
                    includeInfraSelectors: false
                  timeout: 15m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        delegateSelectors:
          - helm-delegate
  identifier: mowerjava_cicd
  tags: {}
  name: mower-java - ci-cd
