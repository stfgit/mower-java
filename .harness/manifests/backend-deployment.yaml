apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.deploymentName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backend.app.name }}
    environment: {{ .Values.environment }}
    tier: backend
spec:
  replicas: {{ .Values.backend.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.backend.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.app.name }}
        tier: backend
    spec:
      containers:
      - name: {{ .Values.backend.app.name }}
        image: {{ .Values.backend.image }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SPRING_PROFILES_ACTIVE
          value: "{{ .Values.environment }}"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: {{ .Values.backend.app.resources.requests.memory }}
            cpu: {{ .Values.backend.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.backend.app.resources.limits.memory }}
            cpu: {{ .Values.backend.app.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: /api/mower/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/mower/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5