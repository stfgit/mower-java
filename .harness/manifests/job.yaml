apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.jobName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
    job-id: "{{ .Values.pipelineId }}"
    environment: {{ .Values.environment }}
spec:
  completions: {{ .Values.job.completions }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        job-id: "{{ .Values.pipelineId }}"
    spec:
      restartPolicy: Never
      containers:
      - name: {{ .Values.app.name }}
        image: {{ .Values.image }}
        command: ["java"]
        args: ["-jar", "mower-java.jar"]
        env:
        - name: JOB_ID
          value: "{{ .Values.pipelineId }}"
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: {{ .Values.app.resources.requests.memory }}
            cpu: {{ .Values.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.app.resources.limits.memory }}
            cpu: {{ .Values.app.resources.limits.cpu }}
        volumeMounts:
        - name: input-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: input-data
        configMap:
          name: mower-input-data