# values.yaml
namespace: <+infra.namespace>
jobName: mower-java-<+pipeline.startTs>
deploymentName: mower-java-deployment
serviceName: mower-java-service
image: <+artifacts.primary.image>
pipelineId: <+pipeline.executionId>
environment: <+env.name>

# Configuration de l'application avec variables d'environnement
app:
  name: mower-java
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: <+env.variables.MEMORY_LIMIT>
      cpu: <+env.variables.CPU_LIMIT>
  logLevel: <+env.variables.LOG_LEVEL>

# Configuration du job
job:
  completions: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 300

# Configuration du deployment avec variables d'environnement
deployment:
  replicas: <+env.variables.REPLICAS_COUNT>

