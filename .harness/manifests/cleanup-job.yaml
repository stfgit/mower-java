apiVersion: v1
kind: List
items:
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: mower-java-cleanup
    namespace: <+infra.namespace>
  spec:
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: cleanup
          image: bitnami/kubectl:latest
          command: ["/bin/sh"]
          args:
            - -c
            - |
              # Supprimer les jobs terminés depuis plus de 1 heure
              kubectl delete jobs -l app=mower-java --field-selector=status.successful=1 --ignore-not-found=true
              kubectl delete jobs -l app=mower-java --field-selector=status.failed=3 --ignore-not-found=true