apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.deploymentName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.frontend.app.name }}
    environment: {{ .Values.environment }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.app.name }}
        tier: frontend
    spec:
      containers:
      - name: {{ .Values.frontend.app.name }}
        image: {{ .Values.frontend.image }}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "http://{{ .Values.backend.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:8080"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: {{ .Values.frontend.app.resources.requests.memory }}
            cpu: {{ .Values.frontend.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.frontend.app.resources.limits.memory }}
            cpu: {{ .Values.frontend.app.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5